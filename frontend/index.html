<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%assets/favicon-32.png?v=13" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%assets/favicon-16.png?v=13" />
    <link rel="shortcut icon" href="%BASE_URL%assets/favicon.ico?v=13" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%assets/apple-touch-icon.png?v=13" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      ;(function (location) {
        if (location.search[1] === '/') {
          const decoded = location.search
            .slice(1)
            .split('&')
            .map((segment) => segment.replace(/~and~/g, '&'))
            .join('?')
          window.history.replaceState(null, '', decoded + location.hash)
        }
      })(window.location)
    </script>
    <meta name="description" content="Check whether a news story looks more like real or fake news." />
    <title>Fake News Detection</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
